<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EFFECTIF</title>

    <link
        href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
        rel="stylesheet"
    >

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --gradient-start: rgb(0, 121, 107);
            --gradient-end: rgb(13, 194, 173);

            --color-primary: #5146e5;
            --color-primary-dark: #4338ca;
            --color-primary-light: #eef2ff;

            --color-gray-50: #f8fafc;
            --color-gray-100: #f1f5f9;
            --color-gray-200: #e2e8f0;
            --color-gray-300: #cbd5e1;
            --color-gray-400: #94a3b8;
            --color-gray-500: #64748b;
            --color-gray-600: #475569;
            --color-gray-700: #334155;
            --color-gray-800: #1e293b;
            --color-gray-900: #0f172a;

            --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.05);
            --shadow: 0 4px 6px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 8px 12px rgba(15, 23, 42, 0.10);
            --shadow-lg: 0 12px 24px rgba(15, 23, 42, 0.15);
            --shadow-glow: 0 0 20px rgba(79, 70, 229, 0.15);

            --border-radius-sm: 0.375rem;
            --border-radius: 0.5rem;
            --border-radius-lg: 1rem;
            --border-radius-xl: 1.5rem;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    var(--gradient-start),
                    var(--gradient-end)
                );

            color: var(--color-gray-900);

            line-height: 1.5;
        }

        .container {
            max-width: 64rem;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.95);

            backdrop-filter: blur(12px);

            border-radius: var(--border-radius-xl);

            box-shadow:
                var(--shadow-lg),
                var(--shadow-glow);

            overflow: hidden;

            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ==========================================
           FORM TOGGLE
        ========================================== */

        .form-toggle {
            display: flex;

            border-bottom:
                1px solid var(--color-gray-200);

            padding: 0.5rem;

            gap: 0.5rem;

            background:
                var(--color-gray-50);
        }

        .toggle-btn {
            flex: 1;

            padding:
                1rem 1.5rem;

            font-size: 1.125rem;

            font-weight: 600;

            color:
                var(--color-gray-600);

            background: none;

            border: none;

            cursor: pointer;

            transition:
                all 0.3s;

            border-radius:
                var(--border-radius);

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 0.75rem;
        }

        .toggle-btn.active {
            background:
                linear-gradient(
                    135deg,
                    var(--gradient-start),
                    var(--gradient-end)
                );

            color: white;

            box-shadow:
                var(--shadow-md);
        }

        .toggle-btn:hover:not(.active) {
            background:
                var(--color-gray-100);

            color:
                var(--color-primary);
        }

        /* ==========================================
           FORM
        ========================================== */

        .form-content {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;

            font-size: 0.875rem;

            font-weight: 600;

            color:
                var(--color-gray-700);

            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;

            padding:
                0.875rem 1.25rem;

            border:
                2px solid var(--color-gray-200);

            border-radius:
                var(--border-radius);

            font-size: 1rem;

            background:
                var(--color-gray-50);
        }

        .form-input:focus {
            outline: none;

            border-color:
                var(--color-primary);

            background:
                white;
        }

        /* ==========================================
           BUTTON
        ========================================== */

        .btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                0.875rem 1.5rem;

            font-weight: 600;

            font-size: 1rem;

            border-radius:
                var(--border-radius);

            cursor: pointer;

            border: none;

            gap: 0.75rem;
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    var(--gradient-start),
                    var(--gradient-end)
                );

            color: white;

            width: 100%;

            box-shadow:
                var(--shadow-md);
        }

        .btn-secondary {
            background:
                var(--color-gray-100);

            color:
                var(--color-gray-700);
        }

        /* ==========================================
           SELECT2
        ========================================== */

        .select2-container {
            width: 100% !important;
        }

        .select2-container
        .select2-selection--single {
            height: 52px !important;

            border:
                2px solid var(--color-gray-200) !important;

            border-radius:
                var(--border-radius) !important;

            background:
                var(--color-gray-50) !important;
        }

        .select2-container
        .select2-selection--single
        .select2-selection__rendered {
            line-height: 48px !important;

            padding-left:
                1.25rem !important;
        }

        .select2-container
        .select2-selection--single
        .select2-selection__arrow {
            height: 48px !important;
        }

        /* ==========================================
           TASKS
        ========================================== */

        .task-list {
            display: grid;

            gap: 1rem;

            margin-top: 1.5rem;
        }

        .task-item {
            background:
                linear-gradient(
                    135deg,
                    var(--color-primary-light),
                    white
                );

            padding:
                1.25rem;

            border-radius:
                var(--border-radius-lg);

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap: 1rem;

            border:
                1px solid rgba(79, 70, 229, 0.1);

            box-shadow:
                var(--shadow-sm);
        }

        .task-name {
            font-weight: 600;

            color:
                var(--color-gray-800);

            flex: 1;
        }

        .task-item input[type="number"] {
            width: 6rem;

            padding:
                0.625rem;

            border:
                2px solid var(--color-primary);

            border-radius:
                var(--border-radius);

            text-align:
                center;

            font-weight:
                600;

            color:
                var(--color-primary);

            background:
                white;
        }

        /* ==========================================
           COUNTER
        ========================================== */

        .counter {
            position: fixed;

            top: 1.5rem;

            right: 1.5rem;

            background:
                linear-gradient(
                    135deg,
                    var(--gradient-start),
                    var(--gradient-end)
                );

            color: white;

            padding:
                1rem 2rem;

            border-radius:
                9999px;

            font-size:
                1.5rem;

            font-weight:
                700;

            box-shadow:
                var(--shadow-lg);

            z-index:
                50;
        }

        /* ==========================================
           MODAL
        ========================================== */

        .modal {
            position: fixed;

            inset: 0;

            background:
                rgba(15, 23, 42, 0.7);

            backdrop-filter:
                blur(8px);

            display: none;

            align-items:
                center;

            justify-content:
                center;

            padding:
                1.5rem;

            z-index:
                100;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background:
                white;

            padding:
                2.5rem;

            border-radius:
                var(--border-radius-xl);

            width:
                100%;

            max-width:
                32rem;

            position:
                relative;

            box-shadow:
                var(--shadow-lg);

            max-height:
                90vh;

            overflow:
                auto;
        }

        .modal-header {
            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                2rem;
        }

        .modal-title {
            font-size:
                1.75rem;

            font-weight:
                700;

            color:
                var(--color-gray-900);
        }

        .modal-close {
            background: none;

            border: none;

            color:
                var(--color-gray-400);

            cursor: pointer;

            padding:
                0.5rem;
        }

        .search-container {
            position:
                relative;

            margin-bottom:
                1.5rem;
        }

        .search-input {
            width:
                100%;

            padding:
                1rem;

            border:
                2px solid var(--color-gray-200);

            border-radius:
                var(--border-radius-lg);

            font-size:
                1rem;

            background:
                var(--color-gray-50);
        }

        .search-input:focus {
            outline:
                none;

            border-color:
                var(--color-primary);

            background:
                white;
        }

        .task-checkbox-list {
            max-height:
                24rem;

            overflow-y:
                auto;

            margin:
                1.5rem 0;
        }

        .task-checkbox-item {
            display:
                flex;

            align-items:
                center;

            padding:
                1rem;

            border-radius:
                var(--border-radius);

            cursor:
                pointer;

            margin-bottom:
                0.5rem;
        }

        .task-checkbox-item:hover {
            background:
                var(--color-gray-50);
        }

        .task-checkbox-item input[type="checkbox"] {
            width:
                1.25rem;

            height:
                1.25rem;

            margin-right:
                1rem;

            cursor:
                pointer;
        }

        .loading {
            text-align:
                center;

            padding:
                2rem;

            color:
                var(--color-gray-500);
        }

        .empty {
            text-align:
                center;

            padding:
                2rem;

            color:
                var(--color-gray-500);
        }

        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 640px) {

            .container {
                margin:
                    1rem;

                padding:
                    0;
            }

            .form-toggle {
                flex-direction:
                    column;
            }

            .modal-content {
                padding:
                    1.5rem;
            }

            .counter {
                top:
                    1rem;

                right:
                    1rem;

                font-size:
                    1.25rem;

                padding:
                    0.75rem 1.5rem;
            }

            .form-content {
                padding:
                    1.25rem;
            }

        }

    </style>
</head>


<body>

    <!-- ==========================================
         COUNTER
    ========================================== -->

    <div
        class="counter"
        id="total-counter"
    >
        0
    </div>


    <div class="container">

        <div class="card">

            <!-- ======================================
                 FORM TOGGLE
            ======================================= -->

            <div class="form-toggle">

                <button
                    class="toggle-btn active"
                    data-form="1"
                    type="button"
                >

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path
                            d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"
                        />

                        <circle
                            cx="9"
                            cy="7"
                            r="4"
                        />

                        <path
                            d="M23 21v-2a4 4 0 0 0-3-3.87"
                        />

                        <path
                            d="M16 3.13a4 4 0 0 1 0 7.75"
                        />

                    </svg>

                    Les Équipes

                </button>


                <button
                    class="toggle-btn"
                    data-form="2"
                    type="button"
                >

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path
                            d="M9 11l3 3L22 4"
                        />

                        <path
                            d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
                        />

                    </svg>

                    Les Tâches

                </button>

            </div>


            <!-- ======================================
                 FORM CONTENT
            ======================================= -->

            <div class="form-content">

                <!-- DATE -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="date"
                    >
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        class="form-input"
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="category"
                    >
                        Taches / Equipe
                    </label>

                    <select
                        id="category"
                        class="form-input"
                    >

                        <option value="">
                            Chargement...
                        </option>

                    </select>

                </div>


                <!-- SELECT TASKS -->

                <button
                    id="select-tasks"
                    class="btn btn-primary"
                    type="button"
                >

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path
                            d="M12 5v14"
                        />

                        <path
                            d="M5 12h14"
                        />

                    </svg>

                    Sélectionner les Tâches / Equipe

                </button>


                <!-- SELECTED TASKS -->

                <div
                    id="selected-tasks"
                    class="task-list"
                >
                </div>


                <!-- SUBMIT -->

                <button
                    id="submit"
                    class="btn btn-primary"
                    style="display:none; margin-top:1.5rem;"
                    type="button"
                >

                    Envoyer

                </button>

            </div>

        </div>

    </div>


    <!-- ==========================================
         TASK MODAL
    =========================================== -->

    <div
        id="task-modal"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 class="modal-title">
                    Sélectionner des Tâches
                </h2>

                <button
                    class="modal-close"
                    type="button"
                    aria-label="Fermer"
                >

                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path
                            d="M18 6L6 18"
                        />

                        <path
                            d="M6 6l12 12"
                        />

                    </svg>

                </button>

            </div>


            <div class="search-container">

                <input
                    type="text"
                    id="search"
                    class="search-input"
                    placeholder="Rechercher..."
                >

            </div>


            <div
                id="task-list"
                class="task-checkbox-list"
            >

                <div class="loading">
                    Chargement...
                </div>

            </div>


            <div
                style="
                    display:flex;
                    justify-content:flex-end;
                    gap:1rem;
                    margin-top:1.5rem;
                "
            >

                <button
                    class="btn btn-primary"
                    id="confirm-selection"
                    type="button"
                >
                    Terminé
                </button>

            </div>

        </div>

    </div>


    <!-- ==========================================
         CONFIRMATION MODAL
    =========================================== -->

    <div
        id="confirmation-modal"
        class="modal"
    >

        <div class="modal-content">

            <h2
                class="modal-title"
                style="margin-bottom:1rem;"
            >
                Confirmer l'envoi
            </h2>


            <p
                style="
                    color:var(--color-gray-600);
                    margin-bottom:1.5rem;
                "
            >
                Êtes-vous sûr de vouloir envoyer ces données ?
            </p>


            <div
                style="
                    display:flex;
                    justify-content:flex-end;
                    gap:1rem;
                "
            >

                <button
                    class="btn btn-secondary"
                    id="cancel-submit"
                    type="button"
                >
                    Annuler
                </button>


                <button
                    class="btn btn-primary"
                    id="confirm-submit"
                    type="button"
                    style="width:auto;"
                >
                    Confirmer
                </button>

            </div>

        </div>

    </div>


<script>

/* =====================================================
   STATE
===================================================== */

let activeForm = 1;

let categories = [];

let tasks = [];

let selectedTasks = [];


/* =====================================================
   GOOGLE APPS SCRIPT URLS
===================================================== */

/*
 * FORM 1 - NEW URL
 */

const CATEGORY_URL_1 =
    'https://script.google.com/macros/s/AKfycbyrhyOXdpLGHEpZskGjVn3wkX-dIJlpVpSFM-nridxoNCHj6JowGaSWMX1hKvW9wbwHAg/exec';


/*
 * FORM 2
 */

const CATEGORY_URL_2 =
    'https://script.google.com/macros/s/AKfycbxoy923OwLPZA7S2wq5qOjcp8xA1IVc-28vxSMXDCqobxt9keI_NRfQLwe9E1Y1w12OoQ/exec';


/*
 * TASKS
 */

const TASK_URL_1 =
    'https://script.google.com/macros/s/AKfycbzXLs8hnSLVmny0fm2of-JCM0rboTyNvFA8Vsvi_trtAEIUkIdmu5EZWFmKXXXPtUE-oA/exec';

const TASK_URL_2 =
    'https://script.google.com/macros/s/AKfycbxpr6RkAEwDWM-rJ6bL-KUl33oNECqJeGamHvfMvCCWv6MgF9318VDQ4qBQZPCPYoPDsA/exec';


/*
 * SUBMIT
 */

const SUBMIT_URL_1 =
    'https://script.google.com/macros/s/AKfycbxDUEwNj-Ex8PE08Fcl0Hr62NUQBo2ZQowsy5steHKsuCaOgEjQ-TnjeDAuNrJ86rZd/exec';

const SUBMIT_URL_2 =
    'https://script.google.com/macros/s/AKfycbzKpIzXMQF46Pxy6wsKrdvz8HJ_Aufb1IZbNFj6m9FZZ6j1ueYADrXCNFnYvvd2JJYL/exec';


/* =====================================================
   DATE
===================================================== */

document.getElementById('date').value =
    new Date().toISOString().split('T')[0];


/* =====================================================
   FETCH CATEGORIES
===================================================== */

async function fetchCategories() {

    const url =
        activeForm === 1
            ? CATEGORY_URL_1
            : CATEGORY_URL_2;


    const select =
        document.getElementById('category');


    try {

        console.log(
            'Fetching categories:',
            url
        );


        select.innerHTML =
            '<option value="">Chargement...</option>';


        const response =
            await fetch(
                url,
                {
                    method: 'GET',
                    redirect: 'follow',
                    cache: 'no-cache'
                }
            );


        console.log(
            'HTTP status:',
            response.status
        );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status} ${response.statusText}`
            );

        }


        const text =
            await response.text();


        console.log(
            'Google response:',
            text
        );


        let result;


        try {

            result =
                JSON.parse(text);

        } catch (jsonError) {

            console.error(
                'Invalid JSON response:',
                text
            );

            throw new Error(
                'Google Apps Script returned HTML instead of JSON'
            );

        }


        console.log(
            'Parsed result:',
            result
        );


        /*
         * FORMAT 1:
         *
         * {
         *   success: true,
         *   data: [...]
         * }
         */

        if (
            result &&
            result.success === true &&
            Array.isArray(result.data)
        ) {

            categories =
                result.data;

        }


        /*
         * FORMAT 2:
         *
         * [...]
         */

        else if (
            Array.isArray(result)
        ) {

            categories =
                result;

        }


        else {

            throw new Error(
                'Invalid categories response format'
            );

        }


        /*
         * NORMALIZE
         */

        categories =
            categories
                .map(item => {

                    if (
                        typeof item === 'object' &&
                        item !== null
                    ) {

                        return String(
                            item.category ||
                            item.task ||
                            item.name ||
                            ''
                        ).trim();

                    }


                    return String(item).trim();

                })
                .filter(
                    item =>
                        item !== ''
                );


        console.log(
            'Categories loaded:',
            categories
        );


        /*
         * UPDATE SELECT
         */

        select.innerHTML =
            '<option value="">Sélectionnez taches / equipe</option>';


        categories.forEach(
            category => {

                const option =
                    document.createElement(
                        'option'
                    );


                option.value =
                    category;


                option.textContent =
                    category;


                select.appendChild(
                    option
                );

            }
        );


        /*
         * Refresh Select2
         */

        if (
            window.jQuery &&
            $('#category').hasClass(
                'select2-hidden-accessible'
            )
        ) {

            $('#category').trigger(
                'change.select2'
            );

        }


    } catch (error) {

        console.error(
            'Erreur lors de la récupération des catégories:',
            error
        );


        select.innerHTML =
            '<option value="">Erreur de chargement</option>';


        showError(
            'Échec du chargement des catégories\n\n' +
            error.message
        );

    }

}


/* =====================================================
   FETCH TASKS
===================================================== */

async function fetchTasks() {

    const url =
        activeForm === 1
            ? TASK_URL_1
            : TASK_URL_2;


    const container =
        document.getElementById(
            'task-list'
        );


    try {

        console.log(
            'Fetching tasks:',
            url
        );


        container.innerHTML =
            '<div class="loading">Chargement...</div>';


        const response =
            await fetch(
                url,
                {
                    method: 'GET',
                    redirect: 'follow',
                    cache: 'no-cache'
                }
            );


        console.log(
            'Tasks HTTP status:',
            response.status
        );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status} ${response.statusText}`
            );

        }


        const text =
            await response.text();


        console.log(
            'Tasks response:',
            text
        );


        let result;


        try {

            result =
                JSON.parse(text);

        } catch (error) {

            throw new Error(
                'Google Apps Script returned invalid JSON for tasks'
            );

        }


        if (
            result &&
            result.success === true &&
            Array.isArray(result.data)
        ) {

            tasks =
                result.data;

        }

        else if (
            Array.isArray(result)
        ) {

            tasks =
                result;

        }

        else {

            throw new Error(
                'Invalid tasks response'
            );

        }


        /*
         * NORMALIZE TASKS
         */

        tasks =
            tasks
                .map(item => {

                    if (
                        typeof item === 'object' &&
                        item !== null
                    ) {

                        return {
                            task:
                                String(
                                    item.task ||
                                    item.name ||
                                    item.category ||
                                    ''
                                ).trim()
                        };

                    }


                    return {
                        task:
                            String(item).trim()
                    };

                })
                .filter(
                    item =>
                        item.task !== ''
                );


        console.log(
            'Tasks loaded:',
            tasks
        );


        renderTaskList();


    } catch (error) {

        console.error(
            'Erreur lors de la récupération des tâches:',
            error
        );


        container.innerHTML =
            `
            <div class="empty">
                Impossible de charger les tâches.
            </div>
            `;


        showError(
            'Échec du chargement des tâches\n\n' +
            error.message
        );

    }

}


/* =====================================================
   FORM SWITCH
===================================================== */

document
    .querySelectorAll('.toggle-btn')
    .forEach(
        button => {

            button.addEventListener(
                'click',
                async () => {

                    document
                        .querySelectorAll(
                            '.toggle-btn'
                        )
                        .forEach(
                            btn =>
                                btn.classList.remove(
                                    'active'
                                )
                        );


                    button.classList.add(
                        'active'
                    );


                    activeForm =
                        parseInt(
                            button.dataset.form
                        );


                    resetForm();


                    await fetchCategories();

                }
            );

        }
    );


/* =====================================================
   OPEN TASK MODAL
===================================================== */

document
    .getElementById(
        'select-tasks'
    )
    .addEventListener(
        'click',
        async () => {

            const category =
                document
                    .getElementById(
                        'category'
                    )
                    .value;


            if (!category) {

                showError(
                    'Sélectionnez une catégorie'
                );

                return;

            }


            document
                .getElementById(
                    'task-modal'
                )
                .classList.add(
                    'show'
                );


            await fetchTasks();

        }
    );


/* =====================================================
   CLOSE TASK MODAL
===================================================== */

document
    .querySelector(
        '.modal-close'
    )
    .addEventListener(
        'click',
        () => {

            document
                .getElementById(
                    'task-modal'
                )
                .classList.remove(
                    'show'
                );

        }
    );


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById(
        'search'
    )
    .addEventListener(
        'input',
        event => {

            const search =
                event.target.value
                    .toLowerCase()
                    .trim();


            const filtered =
                tasks.filter(
                    task =>
                        task.task
                            .toLowerCase()
                            .includes(
                                search
                            )
                );


            renderTaskList(
                filtered
            );

        }
    );


/* =====================================================
   RENDER TASK LIST
===================================================== */

function renderTaskList(
    list = tasks
) {

    const container =
        document.getElementById(
            'task-list'
        );


    if (!list.length) {

        container.innerHTML =
            `
            <div class="empty">
                Aucune tâche trouvée.
            </div>
            `;

        return;

    }


    container.innerHTML =
        list
            .map(
                task => {

                    const checked =
                        selectedTasks.some(
                            selected =>
                                selected.task ===
                                task.task
                        );


                    return `
                        <label
                            class="task-checkbox-item"
                        >

                            <input
                                type="checkbox"
                                value="${escapeHtml(task.task)}"
                                ${checked ? 'checked' : ''}
                            >

                            <span>
                                ${escapeHtml(task.task)}
                            </span>

                        </label>
                    `;

                }
            )
            .join('');


    /*
     * CHECKBOX EVENTS
     */

    container
        .querySelectorAll(
            'input[type="checkbox"]'
        )
        .forEach(
            checkbox => {

                checkbox.addEventListener(
                    'change',
                    () => {

                        const taskName =
                            checkbox.value;


                        if (
                            checkbox.checked
                        ) {

                            const exists =
                                selectedTasks.some(
                                    task =>
                                        task.task ===
                                        taskName
                                );


                            if (!exists) {

                                selectedTasks.push({
                                    task:
                                        taskName,

                                    count:
                                        0
                                });

                            }

                        }

                        else {

                            selectedTasks =
                                selectedTasks.filter(
                                    task =>
                                        task.task !==
                                        taskName
                                );

                        }

                    }
                );

            }
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            'div'
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   CONFIRM SELECTION
===================================================== */

document
    .getElementById(
        'confirm-selection'
    )
    .addEventListener(
        'click',
        () => {

            document
                .getElementById(
                    'task-modal'
                )
                .classList.remove(
                    'show'
                );


            renderSelectedTasks();

        }
    );


/* =====================================================
   RENDER SELECTED TASKS
===================================================== */

function renderSelectedTasks() {

    const container =
        document.getElementById(
            'selected-tasks'
        );


    if (!selectedTasks.length) {

        container.innerHTML =
            '';

        document
            .getElementById(
                'submit'
            )
            .style.display =
                'none';

        updateTotal();

        return;

    }


    container.innerHTML =
        selectedTasks
            .map(
                (task, index) => {

                    return `
                        <div class="task-item">

                            <span class="task-name">
                                ${escapeHtml(task.task)}
                            </span>

                            <input
                                type="number"
                                min="1"
                                value="${task.count || ''}"
                                data-index="${index}"
                                class="task-count-input"
                            >

                        </div>
                    `;

                }
            )
            .join('');


    /*
     * NUMBER INPUT EVENTS
     */

    container
        .querySelectorAll(
            '.task-count-input'
        )
        .forEach(
            input => {

                input.addEventListener(
                    'input',
                    () => {

                        const index =
                            parseInt(
                                input.dataset.index
                            );


                        if (
                            selectedTasks[index]
                        ) {

                            selectedTasks[index].count =
                                parseInt(
                                    input.value
                                ) || 0;


                            updateTotal();

                        }

                    }
                );

            }
        );


    document
        .getElementById(
            'submit'
        )
        .style.display =
            'block';


    updateTotal();

}


/* =====================================================
   UPDATE COUNT
===================================================== */

function updateTaskCount(
    taskName,
    count
) {

    const task =
        selectedTasks.find(
            item =>
                item.task ===
                taskName
        );


    if (task) {

        task.count =
            parseInt(count) || 0;


        updateTotal();

    }

}


/* =====================================================
   TOTAL
===================================================== */

function updateTotal() {

    const total =
        selectedTasks.reduce(
            (sum, task) =>
                sum +
                (parseInt(task.count) || 0),
            0
        );


    document
        .getElementById(
            'total-counter'
        )
        .textContent =
            total;

}


/* =====================================================
   SUBMIT BUTTON
===================================================== */

document
    .getElementById(
        'submit'
    )
    .addEventListener(
        'click',
        () => {

            if (!selectedTasks.length) {

                showError(
                    'Sélectionnez au moins une tâche'
                );

                return;

            }


            document
                .getElementById(
                    'confirmation-modal'
                )
                .classList.add(
                    'show'
                );

        }
    );


/* =====================================================
   CANCEL SUBMIT
===================================================== */

document
    .getElementById(
        'cancel-submit'
    )
    .addEventListener(
        'click',
        () => {

            document
                .getElementById(
                    'confirmation-modal'
                )
                .classList.remove(
                    'show'
                );

        }
    );


/* =====================================================
   CONFIRM SUBMIT
===================================================== */

document
    .getElementById(
        'confirm-submit'
    )
    .addEventListener(
        'click',
        submitData
    );


/* =====================================================
   SUBMIT DATA
===================================================== */

async function submitData() {

    const date =
        document
            .getElementById(
                'date'
            )
            .value;


    const category =
        document
            .getElementById(
                'category'
            )
            .value;


    /*
     * VALIDATION
     */

    if (
        !date ||
        !category ||
        !selectedTasks.length
    ) {

        showError(
            'Veuillez remplir tous les champs obligatoires'
        );

        return;

    }


    /*
     * ONLY TASKS WITH COUNT
     */

    const tasksWithCount =
        selectedTasks.filter(
            task =>
                parseInt(task.count) > 0
        );


    if (!tasksWithCount.length) {

        showError(
            'Veuillez saisir au moins un nombre de tâches'
        );

        return;

    }


    /*
     * PAYLOAD
     */

    const payload = {

        date:
            date,

        category:
            category,

        FINCA:
            'FINCA 21',

        tasks:
            tasksWithCount

    };


    console.log(
        'Submitting payload:',
        payload
    );


    const url =
        activeForm === 1
            ? SUBMIT_URL_1
            : SUBMIT_URL_2;


    try {

        /*
         * GOOGLE APPS SCRIPT
         *
         * no-cors is kept here because this is
         * the behavior used by your original code.
         */

        await fetch(
            url,
            {
                method:
                    'POST',

                mode:
                    'no-cors',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );


        showSuccess(
            'Effectif soumis avec succès!'
        );


        document
            .getElementById(
                'confirmation-modal'
            )
            .classList.remove(
                'show'
            );


        resetForm();


        /*
         * Reload categories after reset
         */

        await fetchCategories();


    } catch (error) {

        console.error(
            'Submit error:',
            error
        );


        showError(
            'Échec de la soumission des effectifs\n\n' +
            error.message
        );

    }

}


/* =====================================================
   RESET FORM
===================================================== */

function resetForm() {

    selectedTasks = [];


    /*
     * CATEGORY
     */

    const category =
        document.getElementById(
            'category'
        );


    category.innerHTML =
        '<option value="">Chargement...</option>';


    /*
     * SELECTED TASKS
     */

    document
        .getElementById(
            'selected-tasks'
        )
        .innerHTML =
            '';


    /*
     * TASK MODAL
     */

    document
        .getElementById(
            'task-list'
        )
        .innerHTML =
            '<div class="loading">Chargement...</div>';


    /*
     * SEARCH
     */

    document
        .getElementById(
            'search'
        )
        .value =
            '';


    /*
     * SUBMIT
     */

    document
        .getElementById(
            'submit'
        )
        .style.display =
            'none';


    /*
     * COUNTER
     */

    document
        .getElementById(
            'total-counter'
        )
        .textContent =
            '0';


    /*
     * DATA
     */

    tasks = [];

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
) {

    alert(
        message
    );

}


/* =====================================================
   SUCCESS
===================================================== */

function showSuccess(
    message
) {

    alert(
        message
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

$(document).ready(
    async function() {

        /*
         * Select2
         */

        $('#category').select2({
            width: '100%',
            placeholder:
                'Sélectionnez taches / equipe',
            allowClear: true
        });


        /*
         * Load categories
         */

        await fetchCategories();

    }
);

</script>
