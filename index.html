<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EFFECTIF</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
    >

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --gradient-start: rgb(0, 121, 107);
            --gradient-end: rgb(13, 194, 173);

            --primary: #5146e5;
            --primary-dark: #4338ca;

            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;

            --shadow:
                0 8px 25px rgba(15, 23, 42, 0.12);

            --radius: 10px;
            --radius-lg: 16px;
        }

        body {
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    var(--gradient-start),
                    var(--gradient-end)
                );

            color: var(--gray-900);
        }

        .container {
            width: 100%;
            max-width: 1000px;

            margin: 30px auto;

            padding: 0 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);

            border-radius: 22px;

            overflow: hidden;

            box-shadow: var(--shadow);
        }

        /* ================================
           TOGGLE
        ================================= */

        .form-toggle {
            display: flex;

            gap: 8px;

            padding: 8px;

            background: var(--gray-50);

            border-bottom:
                1px solid var(--gray-200);
        }

        .toggle-btn {
            flex: 1;

            border: none;

            background: transparent;

            color: var(--gray-600);

            padding: 15px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .toggle-btn:hover {
            background: var(--gray-100);
        }

        .toggle-btn.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--gradient-start),
                    var(--gradient-end)
                );

            box-shadow:
                0 4px 10px rgba(0, 121, 107, 0.25);
        }

        /* ================================
           CONTENT
        ================================= */

        .form-content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: var(--gray-700);
        }

        .form-input {
            width: 100%;

            height: 52px;

            padding: 0 15px;

            border:
                2px solid var(--gray-200);

            border-radius: var(--radius);

            background: var(--gray-50);

            font-size: 16px;

            transition: 0.2s;
        }

        .form-input:focus {
            outline: none;

            border-color: var(--primary);

            background: white;
        }

        /* ================================
           BUTTONS
        ================================= */

        .btn {
            width: 100%;

            min-height: 52px;

            padding: 12px 20px;

            border: none;

            border-radius: var(--radius);

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .btn-primary {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--gradient-start),
                    var(--gradient-end)
                );

            box-shadow:
                0 4px 10px rgba(0, 121, 107, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-1px);

            box-shadow:
                0 6px 15px rgba(0, 121, 107, 0.25);
        }

        .btn-secondary {
            color: var(--gray-700);

            background: var(--gray-100);
        }

        /* ================================
           TASK LIST
        ================================= */

        .task-list {
            display: grid;

            gap: 12px;

            margin-top: 22px;
        }

        .task-item {
            display: flex;

            align-items: center;

            gap: 15px;

            padding: 16px;

            border-radius: var(--radius-lg);

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    white
                );

            border:
                1px solid rgba(79, 70, 229, 0.1);
        }

        .task-name {
            flex: 1;

            font-weight: 600;

            color: var(--gray-800);

            word-break: break-word;
        }

        .task-count-input {
            width: 90px;

            height: 44px;

            padding: 5px;

            text-align: center;

            font-size: 16px;

            font-weight: 600;

            border:
                2px solid var(--primary);

            border-radius: 8px;
        }

        /* ================================
           COUNTER
        ================================= */

        .counter {
            position: fixed;

            top: 20px;

            right: 20px;

            z-index: 50;

            padding: 10px 22px;

            border-radius: 999px;

            color: white;

            font-size: 22px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    var(--gradient-start),
                    var(--gradient-end)
                );

            box-shadow: var(--shadow);
        }

        /* ================================
           MODAL
        ================================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(15, 23, 42, 0.7);

            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            width: 100%;

            max-width: 600px;

            max-height: 90vh;

            overflow-y: auto;

            padding: 28px;

            background: white;

            border-radius: 18px;

            box-shadow: var(--shadow);
        }

        .modal-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;

            font-weight: 700;
        }

        .modal-close {
            border: none;

            background: transparent;

            color: var(--gray-500);

            font-size: 28px;

            cursor: pointer;
        }

        /* ================================
           SEARCH
        ================================= */

        .search-input {
            width: 100%;

            height: 50px;

            padding: 0 15px;

            border:
                2px solid var(--gray-200);

            border-radius: var(--radius);

            font-size: 16px;

            margin-bottom: 15px;
        }

        .search-input:focus {
            outline: none;

            border-color: var(--primary);
        }

        /* ================================
           CHECKBOX
        ================================= */

        .task-checkbox-list {
            max-height: 450px;

            overflow-y: auto;
        }

        .task-checkbox-item {
            display: flex;

            align-items: center;

            gap: 12px;

            padding: 13px;

            margin-bottom: 5px;

            border-radius: 8px;

            cursor: pointer;
        }

        .task-checkbox-item:hover {
            background: var(--gray-50);
        }

        .task-checkbox-item input {
            width: 20px;

            height: 20px;

            cursor: pointer;
        }

        .task-checkbox-item span {
            flex: 1;

            font-size: 15px;

            color: var(--gray-800);
        }

        /* ================================
           STATUS
        ================================= */

        .loading,
        .empty {
            text-align: center;

            padding: 30px;

            color: var(--gray-500);
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .container {
                margin: 10px auto;

                padding: 0 10px;
            }

            .form-content {
                padding: 20px;
            }

            .form-toggle {
                flex-direction: column;
            }

            .counter {
                top: 10px;

                right: 10px;

                font-size: 18px;

                padding: 8px 16px;
            }

            .task-item {
                align-items: flex-start;

                flex-direction: column;
            }

            .task-count-input {
                width: 100%;
            }

        }

    </style>
</head>


<body>

<!-- =====================================================
     COUNTER
===================================================== -->

<div
    id="total-counter"
    class="counter"
>
    0
</div>


<div class="container">

    <div class="card">

        <!-- =================================================
             FORM TOGGLE
        ================================================== -->

        <div class="form-toggle">

            <button
                type="button"
                class="toggle-btn active"
                data-form="1"
            >
                Les Équipes
            </button>

            <button
                type="button"
                class="toggle-btn"
                data-form="2"
            >
                Les Tâches
            </button>

        </div>


        <!-- =================================================
             FORM
        ================================================== -->

        <div class="form-content">

            <!-- DATE -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="date"
                >
                    Date
                </label>

                <input
                    id="date"
                    type="date"
                    class="form-input"
                >

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="category"
                >
                    Taches / Equipe
                </label>

                <select
                    id="category"
                    class="form-input"
                >
                    <option value="">
                        Chargement...
                    </option>
                </select>

            </div>


            <!-- SELECT TASKS -->

            <button
                id="select-tasks"
                type="button"
                class="btn btn-primary"
            >
                Sélectionner les Tâches / Equipe
            </button>


            <!-- SELECTED TASKS -->

            <div
                id="selected-tasks"
                class="task-list"
            >
            </div>


            <!-- SUBMIT -->

            <button
                id="submit"
                type="button"
                class="btn btn-primary"
                style="
                    display:none;
                    margin-top:20px;
                "
            >
                Envoyer
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     TASK MODAL
===================================================== -->

<div
    id="task-modal"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2 class="modal-title">
                Sélectionner des Tâches
            </h2>

            <button
                id="close-task-modal"
                type="button"
                class="modal-close"
            >
                ×
            </button>

        </div>


        <input
            id="search"
            type="text"
            class="search-input"
            placeholder="Rechercher..."
        >


        <div
            id="task-list"
            class="task-checkbox-list"
        >
            <div class="loading">
                Chargement...
            </div>
        </div>


        <button
            id="confirm-selection"
            type="button"
            class="btn btn-primary"
        >
            Terminé
        </button>

    </div>

</div>


<!-- =====================================================
     CONFIRM MODAL
===================================================== -->

<div
    id="confirmation-modal"
    class="modal"
>

    <div class="modal-content">

        <h2 class="modal-title">
            Confirmer l'envoi
        </h2>

        <p
            style="
                margin-top:15px;
                margin-bottom:25px;
                color:#475569;
            "
        >
            Êtes-vous sûr de vouloir envoyer ces données ?
        </p>


        <div
            style="
                display:flex;
                gap:10px;
            "
        >

            <button
                id="cancel-submit"
                type="button"
                class="btn btn-secondary"
            >
                Annuler
            </button>


            <button
                id="confirm-submit"
                type="button"
                class="btn btn-primary"
            >
                Confirmer
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let activeForm = 1;

let categories = [];

let tasks = [];

let selectedTasks = [];


/* =====================================================
   GOOGLE APPS SCRIPT URLS
===================================================== */

/*
 * CATEGORIES FORM 1
 * THIS ONE IS WORKING - HTTP 200
 */

const CATEGORY_URL_1 =
    'https://script.google.com/macros/s/AKfycbyrhyOXdpLGHEpZskGjVn3wkX-dIJlpVpSFM-nridxoNCHj6JowGaSWMX1hKvW9wbwHAg/exec';


/*
 * CATEGORIES FORM 2
 */

const CATEGORY_URL_2 =
    'https://script.google.com/macros/s/AKfycbxoy923OwLPZA7S2wq5qOjcp8xA1IVc-28vxSMXDCqobxt9keI_NRfQLwe9E1Y1w12OoQ/exec';


/*
 * TASKS FORM 1
 *
 * Keep your existing URL here if it is still valid.
 */

const TASK_URL_1 =
    'https://script.google.com/macros/s/AKfycbzXLs8hnSLVmny0fm2of-JCM0rboTyNvFA8Vsvi_trtAEIUkIdmu5EZWFmKXXXPtUE-oA/exec';


/*
 * TASKS FORM 2
 *
 * NEW URL YOU JUST PROVIDED
 */

const TASK_URL_2 =
    'https://script.google.com/macros/s/AKfycbyiDwnqmdBJjd9b15m2kR5ZmPPOu3n50HdEQ1dBsTugpRo6-0F4ve_jQS7zMyNDOvkq6Q/exec';


/*
 * SUBMIT FORM 1
 */

const SUBMIT_URL_1 =
    'https://script.google.com/macros/s/AKfycbxDUEwNj-Ex8PE08Fcl0Hr62NUQBo2ZQowsy5steHKsuCaOgEjQ-TnjeDAuNrJ86rZd/exec';


/*
 * SUBMIT FORM 2
 */

const SUBMIT_URL_2 =
    'https://script.google.com/macros/s/AKfycbzKpIzXMQF46Pxy6wsKrdvz8HJ_Aufb1IZbNFj6m9FZZ6j1ueYADrXCNFnYvvd2JJYL/exec';


/* =====================================================
   DATE
===================================================== */

document.getElementById('date').value =
    new Date().toISOString().split('T')[0];


/* =====================================================
   FETCH CATEGORIES
===================================================== */

async function fetchCategories() {

    const url =
        activeForm === 1
            ? CATEGORY_URL_1
            : CATEGORY_URL_2;


    console.log(
        'Fetching categories:',
        url
    );


    const select =
        document.getElementById('category');


    select.innerHTML =
        '<option value="">Chargement...</option>';


    try {

        const response =
            await fetch(
                url,
                {
                    method: 'GET',
                    redirect: 'follow',
                    cache: 'no-cache'
                }
            );


        console.log(
            'Categories HTTP status:',
            response.status
        );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const text =
            await response.text();


        console.log(
            'Categories response:',
            text
        );


        let result;

        try {

            result =
                JSON.parse(text);

        } catch (error) {

            throw new Error(
                'Response is not valid JSON'
            );

        }


        /*
         * Support:
         *
         * [...]
         *
         * OR
         *
         * {
         *   success: true,
         *   data: [...]
         * }
         */

        if (Array.isArray(result)) {

            categories =
                result;

        }

        else if (
            result &&
            Array.isArray(result.data)
        ) {

            categories =
                result.data;

        }

        else {

            throw new Error(
                'Invalid categories format'
            );

        }


        /*
         * NORMALIZE
         */

        categories =
            categories
                .map(item => {

                    if (
                        typeof item === 'object' &&
                        item !== null
                    ) {

                        return String(
                            item.category ||
                            item.task ||
                            item.name ||
                            ''
                        ).trim();

                    }

                    return String(item).trim();

                })
                .filter(
                    item =>
                        item.length > 0
                );


        console.log(
            'Categories loaded:',
            categories
        );


        select.innerHTML =
            '<option value="">Sélectionnez taches / equipe</option>';


        categories.forEach(
            category => {

                const option =
                    document.createElement(
                        'option'
                    );

                option.value =
                    category;

                option.textContent =
                    category;

                select.appendChild(
                    option
                );

            }
        );


        /*
         * Update Select2
         */

        if (
            window.jQuery &&
            $('#category').hasClass(
                'select2-hidden-accessible'
            )
        ) {

            $('#category').trigger(
                'change.select2'
            );

        }

    }

    catch (error) {

        console.error(
            'Erreur lors de la récupération des catégories:',
            error
        );


        select.innerHTML =
            '<option value="">Erreur de chargement</option>';


        alert(
            'Erreur de chargement des catégories:\n' +
            error.message
        );

    }

}


/* =====================================================
   FETCH TASKS
===================================================== */

async function fetchTasks() {

    const url =
        activeForm === 1
            ? TASK_URL_1
            : TASK_URL_2;


    console.log(
        'Fetching tasks:',
        url
    );


    const container =
        document.getElementById(
            'task-list'
        );


    container.innerHTML =
        '<div class="loading">Chargement...</div>';


    try {

        const response =
            await fetch(
                url,
                {
                    method: 'GET',
                    redirect: 'follow',
                    cache: 'no-cache'
                }
            );


        console.log(
            'Tasks HTTP status:',
            response.status
        );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const text =
            await response.text();


        console.log(
            'Tasks response:',
            text
        );


        let result;

        try {

            result =
                JSON.parse(text);

        }

        catch (error) {

            console.error(
                'Tasks invalid JSON:',
                text
            );

            throw new Error(
                'Tasks response is not valid JSON'
            );

        }


        /*
         * Support both formats:
         *
         * [...]
         *
         * {
         *   success: true,
         *   data: [...]
         * }
         */

        if (Array.isArray(result)) {

            tasks =
                result;

        }

        else if (
            result &&
            Array.isArray(result.data)
        ) {

            tasks =
                result.data;

        }

        else {

            throw new Error(
                'Invalid tasks format'
            );

        }


        /*
         * NORMALIZE
         */

        tasks =
            tasks
                .map(item => {

                    if (
                        typeof item === 'object' &&
                        item !== null
                    ) {

                        return {
                            task:
                                String(
                                    item.task ||
                                    item.name ||
                                    item.category ||
                                    ''
                                ).trim()
                        };

                    }


                    return {
                        task:
                            String(item).trim()
                    };

                })
                .filter(
                    item =>
                        item.task.length > 0
                );


        console.log(
            'Tasks loaded:',
            tasks
        );


        renderTaskList();

    }

    catch (error) {

        console.error(
            'Erreur lors de la récupération des tâches:',
            error
        );


        container.innerHTML = `
            <div class="empty">
                Impossible de charger les tâches.<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


/* =====================================================
   RENDER TASK LIST
===================================================== */

function renderTaskList(list = tasks) {

    const container =
        document.getElementById(
            'task-list'
        );


    if (!list.length) {

        container.innerHTML =
            `
            <div class="empty">
                Aucune tâche trouvée.
            </div>
            `;

        return;

    }


    container.innerHTML =
        list.map(
            task => {

                const isChecked =
                    selectedTasks.some(
                        selected =>
                            selected.task ===
                            task.task
                    );


                return `
                    <label
                        class="task-checkbox-item"
                    >

                        <input
                            type="checkbox"
                            value="${escapeHtml(task.task)}"
                            ${isChecked ? 'checked' : ''}
                        >

                        <span>
                            ${escapeHtml(task.task)}
                        </span>

                    </label>
                `;

            }
        ).join('');


    container
        .querySelectorAll(
            'input[type="checkbox"]'
        )
        .forEach(
            checkbox => {

                checkbox.addEventListener(
                    'change',
                    () => {

                        const taskName =
                            checkbox.value;


                        if (
                            checkbox.checked
                        ) {

                            if (
                                !selectedTasks.some(
                                    task =>
                                        task.task ===
                                        taskName
                                )
                            ) {

                                selectedTasks.push({
                                    task:
                                        taskName,

                                    count:
                                        0
                                });

                            }

                        }

                        else {

                            selectedTasks =
                                selectedTasks.filter(
                                    task =>
                                        task.task !==
                                        taskName
                                );

                        }

                    }
                );

            }
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            'div'
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================================
   TOGGLE FORM
===================================================== */

document
    .querySelectorAll('.toggle-btn')
    .forEach(
        button => {

            button.addEventListener(
                'click',
                async () => {

                    document
                        .querySelectorAll(
                            '.toggle-btn'
                        )
                        .forEach(
                            btn =>
                                btn.classList.remove(
                                    'active'
                                )
                        );


                    button.classList.add(
                        'active'
                    );


                    activeForm =
                        parseInt(
                            button.dataset.form,
                            10
                        );


                    resetForm();


                    await fetchCategories();

                }
            );

        }
    );


/* =====================================================
   OPEN TASK MODAL
===================================================== */

document
    .getElementById(
        'select-tasks'
    )
    .addEventListener(
        'click',
        async () => {

            const category =
                document
                    .getElementById(
                        'category'
                    )
                    .value;


            if (!category) {

                alert(
                    'Veuillez sélectionner une équipe / tâche.'
                );

                return;

            }


            document
                .getElementById(
                    'task-modal'
                )
                .classList.add(
                    'show'
                );


            await fetchTasks();

        }
    );


/* =====================================================
   CLOSE TASK MODAL
===================================================== */

document
    .getElementById(
        'close-task-modal'
    )
    .addEventListener(
        'click',
        () => {

            document
                .getElementById(
                    'task-modal'
                )
                .classList.remove(
                    'show'
                );

        }
    );


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById(
        'search'
    )
    .addEventListener(
        'input',
        event => {

            const search =
                event.target.value
                    .toLowerCase()
                    .trim();


            const filtered =
                tasks.filter(
                    task =>
                        task.task
                            .toLowerCase()
                            .includes(
                                search
                            )
                );


            renderTaskList(
                filtered
            );

        }
    );


/* =====================================================
   CONFIRM TASK SELECTION
===================================================== */

document
    .getElementById(
        'confirm-selection'
    )
    .addEventListener(
        'click',
        () => {

            document
                .getElementById(
                    'task-modal'
                )
                .classList.remove(
                    'show'
                );


            renderSelectedTasks();

        }
    );


/* =====================================================
   RENDER SELECTED TASKS
===================================================== */

function renderSelectedTasks() {

    const container =
        document.getElementById(
            'selected-tasks'
        );


    if (!selectedTasks.length) {

        container.innerHTML =
            '';


        document
            .getElementById(
                'submit'
            )
            .style.display =
                'none';


        updateTotal();

        return;

    }


    container.innerHTML =
        selectedTasks.map(
            (task, index) => {

                return `
                    <div class="task-item">

                        <span class="task-name">
                            ${escapeHtml(task.task)}
                        </span>

                        <input
                            type="number"
                            min="1"
                            value="${task.count || ''}"
                            data-index="${index}"
                            class="task-count-input"
                            placeholder="0"
                        >

                    </div>
                `;

            }
        ).join('');


    container
        .querySelectorAll(
            '.task-count-input'
        )
        .forEach(
            input => {

                input.addEventListener(
                    'input',
                    () => {

                        const index =
                            parseInt(
                                input.dataset.index,
                                10
                            );


                        selectedTasks[index].count =
                            parseInt(
                                input.value,
                                10
                            ) || 0;


                        updateTotal();

                    }
                );

            }
        );


    document
        .getElementById(
            'submit'
        )
        .style.display =
            'block';


    updateTotal();

}


/* =====================================================
   TOTAL
===================================================== */

function updateTotal() {

    const total =
        selectedTasks.reduce(
            (sum, task) =>
                sum +
                (
                    parseInt(
                        task.count,
                        10
                    ) || 0
                ),
            0
        );


    document
        .getElementById(
            'total-counter'
        )
        .textContent =
            total;

}


/* =====================================================
   SUBMIT BUTTON
===================================================== */

document
    .getElementById(
        'submit'
    )
    .addEventListener(
        'click',
        () => {

            const validTasks =
                selectedTasks.filter(
                    task =>
                        parseInt(
                            task.count,
                            10
                        ) > 0
                );


            if (!validTasks.length) {

                alert(
                    'Veuillez saisir au moins une quantité.'
                );

                return;

            }


            document
                .getElementById(
                    'confirmation-modal'
                )
                .classList.add(
                    'show'
                );

        }
    );


/* =====================================================
   CANCEL SUBMIT
===================================================== */

document
    .getElementById(
        'cancel-submit'
    )
    .addEventListener(
        'click',
        () => {

            document
                .getElementById(
                    'confirmation-modal'
                )
                .classList.remove(
                    'show'
                );

        }
    );


/* =====================================================
   CONFIRM SUBMIT
===================================================== */

document
    .getElementById(
        'confirm-submit'
    )
    .addEventListener(
        'click',
        submitData
    );


/* =====================================================
   SUBMIT DATA
===================================================== */

async function submitData() {

    const date =
        document
            .getElementById(
                'date'
            )
            .value;


    const category =
        document
            .getElementById(
                'category'
            )
            .value;


    const validTasks =
        selectedTasks.filter(
            task =>
                parseInt(
                    task.count,
                    10
                ) > 0
        );


    if (
        !date ||
        !category ||
        !validTasks.length
    ) {

        alert(
            'Veuillez remplir tous les champs.'
        );

        return;

    }


    const payload = {

        date:
            date,

        category:
            category,

        FINCA:
            'FINCA 21',

        tasks:
            validTasks.map(
                task => ({
                    task:
                        task.task,

                    count:
                        parseInt(
                            task.count,
                            10
                        )
                })
            )

    };


    const url =
        activeForm === 1
            ? SUBMIT_URL_1
            : SUBMIT_URL_2;


    console.log(
        'Submitting:',
        payload
    );


    console.log(
        'Submit URL:',
        url
    );


    try {

        /*
         * Google Apps Script POST
         */

        await fetch(
            url,
            {
                method: 'POST',

                mode: 'no-cors',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );


        document
            .getElementById(
                'confirmation-modal'
            )
            .classList.remove(
                'show'
            );


        alert(
            'Effectif soumis avec succès !'
        );


        resetForm();


        await fetchCategories();

    }

    catch (error) {

        console.error(
            'Submit error:',
            error
        );


        alert(
            'Erreur lors de la soumission:\n' +
            error.message
        );

    }

}


/* =====================================================
   RESET
===================================================== */

function resetForm() {

    selectedTasks = [];

    tasks = [];


    document
        .getElementById(
            'selected-tasks'
        )
        .innerHTML =
            '';


    document
        .getElementById(
            'task-list'
        )
        .innerHTML =
            `
            <div class="loading">
                Chargement...
            </div>
            `;


    document
        .getElementById(
            'search'
        )
        .value =
            '';


    document
        .getElementById(
            'submit'
        )
        .style.display =
            'none';


    document
        .getElementById(
            'total-counter'
        )
        .textContent =
            '0';

}


/* =====================================================
   INITIALIZATION
===================================================== */

$(document).ready(
    async function() {

        /*
         * SELECT2
         */

        $('#category').select2({
            width: '100%',
            placeholder:
                'Sélectionnez taches / equipe',
            allowClear: true
        });


        /*
         * LOAD CATEGORIES
         */

        await fetchCategories();

    }
);

</script>
